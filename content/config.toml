[site]
title = "Wenbo Zeng"
description = "Academic homepage of Wenbo Zeng, an electrical engineering student and researcher working on wind power, electric drives, and edge intelligence for smart grids."
favicon = "/favicon.png"
last_updated = "October 10, 2026"

[author]
name = "Wenbo Zeng"
title = "Undergraduate Student"
institution = "Zhejiang University"
avatar = "/bio.jpg"

[social]
# Contact information (leave blank or delete to hide)

email = "zengwenboee@zju.edu.cn"
location = "Hangzhou, China"
location_url = "https://maps.google.com/?q=Zhejiang+University+Hangzhou"
location_details = ["Zhejiang University", "Hangzhou, Zhejiang, China"]
github = "https://github.com/EviterLesRoses2"

[features]
# Show a like button on the about page
enable_likes = false

# Display all subpages on a single page
enable_one_page_mode = false

[i18n]
enabled = true
locales = ["zh", "en"]
default_locale = "en"
# "auto" means the locale will be determined by the browser's language setting, "fixed" means the locale will be fixed to the default locale (but can be switched still, if you want to disable, set "enable=false")
mode = "auto"
fixed_locale = "en"
# If true, PRISM will remember user's language preference in browser's localStorage
persist = true
# Show a language switcher on the top right corner
switcher = true

[i18n.labels]
zh = "中文"
en = "English"

